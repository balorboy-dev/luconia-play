<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<!-- Luconia's custom Web shell (Godot 4.6.2's default full-size shell +
		     safe areas): `viewport-fit=cover` lets the canvas run under the notch /
		     Dynamic Island and the home indicator; the game reads the insets from
		     `window.luconiaSafeArea()` (scripts/view/SafeArea.gd) and keeps its
		     bars clear of them. Keep the exporter's GODOT placeholders (the
		     dollar-prefixed names): the export fills them in. Thread support stays
		     OFF (GitHub Pages sends no COOP / COEP). -->
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#171020">
		<!-- PWA (part e): added to the Home Screen the game opens standalone —
		     portrait, no browser bars (the export's manifest says the same; these
		     tags cover iOS, whose status bar then overlays the safe-area top). -->
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="Luconia">
		<title>Luconia</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #171020;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Safe-area probe: an invisible element padded by the browser's safe-area
   insets, so the game can read them as computed px (env() is CSS-only). */
#safe-area-probe {
	position: fixed;
	top: 0;
	left: 0;
	width: 0;
	height: 0;
	visibility: hidden;
	pointer-events: none;
	padding-top: env(safe-area-inset-top, 0px);
	padding-right: env(safe-area-inset-right, 0px);
	padding-bottom: env(safe-area-inset-bottom, 0px);
	padding-left: env(safe-area-inset-left, 0px);
}

/* Service-worker update bar: a newer build installed behind the running one
   (the PWA cache keeps serving the old build until every tab / the app
   closes); a tap drops the old worker and reloads. Hidden until then. */
#update-bar {
	display: none;
	position: fixed;
	left: 0;
	right: 0;
	bottom: 0;
	z-index: 2;
	padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
	background-color: #241830;
	color: #ffe766;
	border-top: 2px solid #ffe766;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 15px;
	font-weight: bold;
	text-align: center;
	cursor: pointer;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: max(10%, env(safe-area-inset-bottom, 0px));
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<div id="safe-area-probe"></div>

		<div id="update-bar">New version ready · tap to restart</div>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
// Safe-area insets for the game (SafeArea.gd reads this through
// JavaScriptBridge): "top,right,bottom,left,dpr" — CSS px per side plus the
// device pixel ratio, so the game can turn them into device px.
window.luconiaSafeArea = function () {
	var dpr = window.devicePixelRatio || 1;
	var probe = document.getElementById('safe-area-probe');
	if (!probe) {
		return '0,0,0,0,' + dpr;
	}
	var cs = window.getComputedStyle(probe);
	var px = function (v) {
		var n = parseFloat(v);
		return (isFinite(n) && n > 0) ? n : 0;
	};
	return [px(cs.paddingTop), px(cs.paddingRight), px(cs.paddingBottom), px(cs.paddingLeft), dpr].join(',');
};

// How the page runs, for the one-time "Add to Home Screen" tip
// (HomeScreenTip.gd reads this through JavaScriptBridge): "standalone,mobile,os"
// — 1 / 0 flags (already installed full screen; a phone or tablet) and
// ios / android / other.
window.luconiaInstall = function () {
	var standalone = false;
	try {
		standalone = (window.navigator.standalone === true)
			|| (!!window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
			|| (!!window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches);
	} catch (e) {
		standalone = false;
	}
	var ua = window.navigator.userAgent || '';
	var ios = /iPhone|iPad|iPod/.test(ua) || (window.navigator.platform === 'MacIntel' && window.navigator.maxTouchPoints > 1);
	var android = /Android/.test(ua);
	var touch = ('ontouchstart' in window) || (window.navigator.maxTouchPoints > 0);
	var small = Math.min(window.screen.width || 0, window.screen.height || 0) < 900;
	var mobile = ios || android || (touch && small);
	return (standalone ? '1' : '0') + ',' + (mobile ? '1' : '0') + ',' + (ios ? 'ios' : (android ? 'android' : 'other'));
};
		</script>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":1463296,"index.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	// A newer build's service worker installed behind the running one (the
	// engine registers the PWA worker at start; its cache keeps the old build
	// until every tab / the installed app closes): show the update bar. A tap
	// unregisters every worker and reloads, so the fresh build loads at once.
	function watchServiceWorkerUpdates() {
		if (!('serviceWorker' in navigator)) {
			return;
		}
		const bar = document.getElementById('update-bar');
		if (!bar) {
			return;
		}
		const show = function () {
			bar.style.display = 'block';
		};
		const watch = function (worker) {
			if (!worker) {
				return;
			}
			worker.addEventListener('statechange', function () {
				if (worker.state === 'installed' && navigator.serviceWorker.controller) {
					show();
				}
			});
		};
		const dropAndReload = function () {
			navigator.serviceWorker.getRegistrations().then(function (regs) {
				return Promise.all(regs.map(function (reg) {
					return reg.unregister();
				}));
			}).catch(function () {
				// Reload anyway.
			}).then(function () {
				window.location.reload();
			});
		};
		bar.addEventListener('click', function () {
			navigator.serviceWorker.getRegistration().then(function (reg) {
				if (reg && reg.waiting) {
					// Godot's worker: skip waiting, claim the clients and
					// navigate them to the fresh build (keeps the cache).
					reg.waiting.postMessage('update');
					window.setTimeout(dropAndReload, 4000);
					return;
				}
				dropAndReload();
			}).catch(dropAndReload);
		});
		navigator.serviceWorker.ready.then(function (reg) {
			if (reg.waiting && navigator.serviceWorker.controller) {
				show();
			}
			watch(reg.installing);
			reg.addEventListener('updatefound', function () {
				watch(reg.installing);
			});
		}).catch(function () {
			// No worker: nothing to watch.
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			watchServiceWorkerUpdates();
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
